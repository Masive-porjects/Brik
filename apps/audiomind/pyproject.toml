[project]
name = "audiomind"
version = "0.1.0"
description = "AI-powered audio mastering studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "librosa>=0.10.0",
    "pedalboard>=0.9.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.0",
    "soxr>=1.0.0",
    "pydub>=0.25.1",
    "demucs-onnx>=0.3.0",
    "supabase>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "psutil>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libs without stubs: restrict ignore_missing_imports to these
# modules only — global strict stays intact.
module = ["scipy.*", "soundfile", "soxr", "demucs_onnx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pedalboard's __init__ imports Pedalboard from the compiled _pedalboard
# module without an __all__ re-export, so strict implicit_reexport flags
# every consumer of `from pedalboard import Pedalboard`. Scope the
# allowance to this third-party boundary only.
module = ["pedalboard"]
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
