name: studio-ci

on:
  # Permite probar el gate a mano: los triggers de abajo soloMatchean apps/studio/**,
  # asi que un commit que solo toque la CI no la dispara.
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/studio/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [develop, main]
    paths:
      - "apps/studio/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      # Node 22 sigue siendo el runtime de `next build`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El repo es bun: workspaces apps/* y bun.lock en la raiz, sin
      # package-lock.json. Por eso `cache: npm` fallaba y `npm ci` abortaba.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # Gate bloqueante: la deuda de lint (17 no-explicit-any, 12 set-state-in-effect,
      # 2 react-hooks/refs) esta pagada, asi que `continue-on-error` ya no aplica.
      - run: bun run lint
      - run: bun run build
        env:
          # Placeholder — el build de Next.js no ejecuta convex, pero
          # necesita la env var presente para no fallar en tiempo de build.
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}

  # Deploy real: requiere el secret CONVEX_DEPLOY_KEY (dashboard de Convex →
  # Settings → Deploy Key de producción). Se activa recién cuando exista.
  deploy-convex:
    if: github.ref == 'refs/heads/main' && vars.CONVEX_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
