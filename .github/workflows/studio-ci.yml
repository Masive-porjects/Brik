name: studio-ci

on:
  # Permite probar el gate a mano: los triggers de abajo soloMatchean apps/studio/**,
  # asi que un commit que solo toque la CI no la dispara.
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/studio/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [develop, main]
    paths:
      - "apps/studio/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      # Node 22 sigue siendo el runtime de `next build`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El repo es bun: workspaces apps/* y bun.lock en la raiz, sin
      # package-lock.json. Por eso `cache: npm` fallaba y `npm ci` abortaba.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # Gate bloqueante: la deuda de lint (17 no-explicit-any, 12 set-state-in-effect,
      # 2 react-hooks/refs) esta pagada, asi que `continue-on-error` ya no aplica.
      - run: bun run lint
      - run: bun run build
