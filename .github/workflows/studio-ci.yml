name: studio-ci

on:
  # Permite probar el gate a mano: los triggers de abajo solo matchean apps/studio/**,
  # así que un commit que solo toque la CI no la dispara.
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/studio/**"
      - "package.json"
      - "package-lock.json"
      - "apps/audiomind/**"
      - "pyproject.toml"
      - "requirements*.txt"
  push:
    branches: [develop, main]
    paths:
      - "apps/studio/**"
      - "apps/audiomind/**"
      - "pyproject.toml"
      - "requirements*.txt"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      # Node 22 sigue siendo el runtime de `next build`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El repo es bun: workspaces apps/* y bun.lock en la raiz, sin
      # package-lock.json. Por eso `cache: npm` fallaba y `npm ci` abortaba.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # Gate bloqueante: la deuda de lint (17 no-explicit-any, 12 set-state-in-effect,
      # 2 react-hooks/refs) esta pagada, así que `continue-on-error` ya no aplica.
      - run: bun run lint
      - run: bun run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audiomind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must match apps/audiomind/Dockerfile: CI has to resolve
          # dependencies with the interpreter production runs, or a version
          # split changes the library behaviour the tests are measuring
          # (librosa 0.11 on 3.11 vs 1.0 on 3.12 did exactly that). Guarded by
          # tests/test_runtime_python_contract.py.
          python-version: "3.12"
      # apt is the slowest and least predictable step of this job: the same
      # package list took 273 s in one run and 37.7 min in another, which is a
      # stalled mirror rather than a bigger dependency tree. Three things
      # follow, and none of them touches the package list itself (it mirrors
      # apps/audiomind/Dockerfile, so CI installs what production runs):
      #   1. --no-install-recommends, exactly like the Dockerfile. Without it
      #      apt also pulls the recommends of ffmpeg/libsox (extra video
      #      drivers, speech voices) that no test needs.
      #   2. retry/timeout knobs plus a step timeout, so a stalled mirror fails
      #      this step in minutes instead of burning 37.
      #   3. the downloaded .debs are cached, so a re-run reuses them. The
      #      package indexes are NOT cached: apt-get update still runs every
      #      time, which keeps a stale index from 404-ing a package version.
      - name: Cache APT downloads
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/studio-ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-
      - name: Install system deps (ffmpeg, sox, libsndfile for audio)
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_CACHE="$HOME/.apt-cache"
          APT_OPTS="-o Dir::Cache::archives=$APT_CACHE/archives -o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          sudo mkdir -p "$APT_CACHE/archives/partial"
          # Root creates the directory, the cache action runs as the runner
          # user: hand it back so a later restore can extract into it.
          sudo chown -R "$(id -u):$(id -g)" "$APT_CACHE"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            ffmpeg libsox-dev libsndfile1 libsndfile1-dev build-essential cmake pkg-config
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      # SongStarter reads samples/*.wav at runtime. The directory is
      # gitignored, so a clean checkout has none and test_songstarter* fails
      # with "Sample not found: .../samples/kick.wav". The generator only uses
      # numpy, so it is cheap and deterministic.
      - name: Generate audio samples
        run: python scripts/generate_samples.py
      - name: Pytest suite
        run: pytest tests/ -q --tb=short
        env:
          # Demo mode env vars so tests don't need external credentials
          AUDIOMIND_PRERENDER_MODE: "on_demand"
          AUDIOMIND_MAX_CONCURRENT_DSP: "1"
          AUDIOMIND_DEMO_MAX_DURATION_SECONDS: "240"
          AUDIOMIND_MAX_FILE_SIZE_MB: "100"
          AUDIOMIND_SESSION_TTL_MINUTES: "60"
          AUDIOMIND_SESSION_STORE_BACKEND: "file"
          AUDIOMIND_DEMUCS_PRECISION: "fp16weights"
          AUDIOMIND_DEMUCS_ISOLATED: "true"
          AUDIOMIND_DEMUCS_THREADS: "4"
          AUDIOMIND_DEMUCS_TIMEOUT_SECONDS: "1800"