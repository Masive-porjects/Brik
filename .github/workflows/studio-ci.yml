name: studio-ci

on:
  # Permite probar el gate a mano: los triggers de abajo solo matchean apps/studio/**,
  # así que un commit que solo toque la CI no la dispara.
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/studio/**"
      - "package.json"
      - "package-lock.json"
      - "apps/audiomind/**"
      - "pyproject.toml"
      - "requirements*.txt"
  push:
    branches: [develop, main]
    paths:
      - "apps/studio/**"
      - "apps/audiomind/**"
      - "pyproject.toml"
      - "requirements*.txt"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      # Node 22 sigue siendo el runtime de `next build`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El repo es bun: workspaces apps/* y bun.lock en la raiz, sin
      # package-lock.json. Por eso `cache: npm` fallaba y `npm ci` abortaba.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # Gate bloqueante: la deuda de lint (17 no-explicit-any, 12 set-state-in-effect,
      # 2 react-hooks/refs) esta pagada, así que `continue-on-error` ya no aplica.
      - run: bun run lint
      - run: bun run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audiomind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps (ffmpeg, sox, libsndfile for audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsox-dev libsndfile1 libsndfile1-dev build-essential cmake pkg-config
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Pytest suite
        run: pytest tests/ -q --tb=short
        env:
          # Demo mode env vars so tests don't need external credentials
          AUDIOMIND_PRERENDER_MODE: "on_demand"
          AUDIOMIND_MAX_CONCURRENT_DSP: "1"
          AUDIOMIND_DEMO_MAX_DURATION_SECONDS: "240"
          AUDIOMIND_MAX_FILE_SIZE_MB: "100"
          AUDIOMIND_SESSION_TTL_MINUTES: "60"
          AUDIOMIND_SESSION_STORE_BACKEND: "file"
          AUDIOMIND_DEMUCS_PRECISION: "fp16weights"
          AUDIOMIND_DEMUCS_ISOLATED: "true"
          AUDIOMIND_DEMUCS_THREADS: "4"
          AUDIOMIND_DEMUCS_TIMEOUT_SECONDS: "1800"